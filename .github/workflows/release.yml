# Compila MyGlossMusic para Windows, macOS y Linux.
#
# No hay compilacion cruzada posible: cada instalador necesita su sistema.
# macOS exige las herramientas de Xcode para firmar y empaquetar el .app, y
# Linux enlaza contra WebKitGTK, que solo existe alli. Por eso son tres maquinas
# y no tres objetivos de una.
#
# Se lanza al empujar una etiqueta `v*` (por ejemplo `v0.1.0`) o a mano desde la
# pestania Actions.
#
# # Antes de la PRIMERA release con actualizacion automatica
#
# Hacen falta dos secretos del repositorio (Settings -> Secrets and variables ->
# Actions). Sin ellos el resto sigue funcionando, pero no se generan los `.sig`
# y la aplicacion instalada rechazara cualquier actualizacion:
#
#   TAURI_SIGNING_PRIVATE_KEY           el CONTENIDO de la clave privada
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contrasenia (vacia si no tiene)
#
# La clave se genera una sola vez, con `npm run tauri signer generate -- -w
# <ruta>`, y NO va al repositorio. Su mitad publica ya esta en
# `tauri.conf.json` como `pubkey`: es la que lleva la aplicacion dentro para
# comprobar la firma. Si se pierde la privada hay que generar otra y publicar
# una version nueva a mano, porque las instalaciones antiguas solo aceptan
# paquetes firmados con la que ya conocen.
#
# # Al publicar
#
# La release se crea como BORRADOR a proposito: nadie actualiza hasta que la
# publiques. Antes de darle a publicar, abre el `latest.json` del borrador y
# comprueba que estan las cuatro plataformas. Cada trabajo de la matriz le anade
# la suya leyendo el que ya subieron los demas, y si dos terminan a la vez uno
# puede pisar al otro.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Los dos Mac son dos maquinas distintas a proposito: Apple Silicon e
          # Intel no se cubren con un solo binario si se quiere que arranque sin
          # Rosetta en los dos.
          - plataforma: macos-latest
            args: "--target aarch64-apple-darwin"
            triple: aarch64-apple-darwin
          - plataforma: macos-latest
            args: "--target x86_64-apple-darwin"
            triple: x86_64-apple-darwin
          - plataforma: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu
          - plataforma: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK 4.1 es el motor requerido por Tauri v2 en Linux.
      # souvlaki requiere libdbus-1-dev, y rodio requiere libasound2-dev.
      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libdbus-1-dev

      # audiopus_sys requiere autoreconf (autoconf, automake, libtool) para compilar opus en macOS.
      - name: Dependencias de macOS
        if: startsWith(matrix.plataforma, 'macos')
        run: brew install autoconf automake libtool

      # Para x86_64 en runners de GitHub Actions (que son Apple Silicon arm64), audiopus_sys intenta
      # compilar Opus llamando a ./configure sin especificar la arquitectura de destino, lo que genera
      # objetos arm64 incompatibles con el linker x86_64. Precompilamos Opus con CMake indicando
      # CMAKE_OSX_ARCHITECTURES="x86_64" y configuramos OPUS_LIB_DIR para que audiopus_sys use este binario directamente.
      - name: Precompilar Opus para x86_64 macOS
        if: matrix.triple == 'x86_64-apple-darwin'
        run: |
          git clone --depth 1 https://github.com/xiph/opus.git /tmp/opus-src
          cmake -B /tmp/opus-build -S /tmp/opus-src \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPUS_BUILD_TESTING=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF
          cmake --build /tmp/opus-build --config Release
          mkdir -p /tmp/opus-lib
          find /tmp/opus-build -name "libopus.a" -exec cp {} /tmp/opus-lib/ \;
          lipo -info /tmp/opus-lib/libopus.a
          echo "OPUS_LIB_DIR=/tmp/opus-lib" >> $GITHUB_ENV
          echo "OPUS_STATIC=1" >> $GITHUB_ENV


      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci --prefix apps/desktop

      # yt-dlp va dentro del instalador como `externalBin`, y Tauri exige un
      # binario por objetivo con el triple en el nombre. Sin el, la aplicacion
      # arranca igual pero cae al acunador, que sirve ~48 s por pista.
      - name: Traer yt-dlp para ${{ matrix.triple }}
        shell: bash
        run: |
          cd apps/desktop/src-tauri/bin
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          case "${{ matrix.triple }}" in
            x86_64-pc-windows-msvc)   url=$base/yt-dlp.exe;        out=yt-dlp-${{ matrix.triple }}.exe ;;
            aarch64-apple-darwin|x86_64-apple-darwin)
                                      url=$base/yt-dlp_macos;      out=yt-dlp-${{ matrix.triple }} ;;
            x86_64-unknown-linux-gnu) url=$base/yt-dlp_linux;      out=yt-dlp-${{ matrix.triple }} ;;
          esac
          if [ ! -f "$out" ]; then curl -fL "$url" -o "$out"; fi
          chmod +x "$out" || true

      - name: Comprobar TypeScript
        run: npx --prefix apps/desktop tsc --noEmit -p apps/desktop/tsconfig.json

      # La firma del actualizador.
      #
      # Sin estas dos variables el bundler NO genera los `.sig`, y sin `.sig` la
      # aplicacion instalada rechaza el paquete: el plugin comprueba la firma
      # contra la clave publica que lleva dentro (`pubkey` en `tauri.conf.json`)
      # antes de instalar nada. Es lo unico que impide que un endpoint
      # secuestrado te instale lo que quiera.
      #
      # `TAURI_SIGNING_PRIVATE_KEY` es el CONTENIDO del archivo de clave
      # privada, no su ruta. Si la clave se genero sin contrasenia, el secreto
      # de la contrasenia se deja vacio, pero tiene que existir.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: MyGlossMusic ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
          # El `latest.json` que lee la aplicacion instalada para saber si hay
          # version nueva. Cada trabajo de la matriz lee el que ya subieron los
          # demas y le anade SU plataforma, asi que el archivo final las junta
          # las cuatro. Antes de publicar el borrador conviene abrirlo y
          # comprobarlo: si dos trabajos terminan en el mismo segundo pueden
          # leer la misma version vieja y uno pisar al otro.
          includeUpdaterJson: true
          # En Windows se empaquetan `.msi` y `.exe`. Para ACTUALIZAR hay que
          # apuntar al NSIS: el `.msi` se instala en Archivos de programa y pide
          # permisos de administrador, que es justo la ventana del sistema que
          # no queremos ver. El NSIS se instala para el usuario actual y corre en
          # silencio.
          updaterJsonPreferNsis: true
